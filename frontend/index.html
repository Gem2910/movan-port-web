<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguyễn Tất Lượng | Portfolio</title>
  <link rel="stylesheet" href="./shared/styles/global.css?v=20261026">
  <link rel="stylesheet" href="./portfolio.css?v=20261026">
</head>
<body data-page="portfolio-v2">
  <!-- CUSTOM PORTFOLIO HEADER -->
  <header class="portfolio-header" id="dynamic-header"><!-- Rendered by JS --></header>
    
  <main id="main" class="portfolio-v2-main">
    
    <!-- HERO SECTION (White) -->
    <section class="section-hero theme-white" id="sec-hero">
      <div class="v2-container">
        <!-- Rendered by JS -->
      </div>
    </section>


    <!-- ABOUT SECTION (White) -->
    <section class="section-about theme-white" id="sec-about">
      <div class="v2-container">
        <!-- Rendered by JS -->
      </div>
    </section>


    <!-- PROJECTS SECTION (Black) -->
    <section class="section-projects theme-black" id="sec-projects">
      <div class="v2-container">
        <h2 class="section-title text-white"><span>My</span> Projects</h2>
        <div class="projects-list" id="projects-list">
          <!-- Rendered by JS -->
        </div>
        <div style="text-align: center; margin-top: 50px;">
          <a href="all-projects.html" style="display: inline-block; padding: 15px 40px; background-color: #fff; color: #000; text-decoration: none; font-weight: bold; font-size: 1.1rem; border-radius: 5px;">XEM TẤT CẢ DỰ ÁN</a>
        </div>
      </div>
    </section>

    <!-- TESTIMONIAL SECTION (White) -->
    <section class="section-testimonial theme-white" id="sec-testimonial">
      <div class="v2-container">
        <h2 class="section-title"><span>Khách hàng</span> Đánh giá</h2>
        <div class="testimonial-grid" id="dynamic-testimonials"><!-- Rendered by JS --></div></div></section>
    <section class="section-contact theme-white" id="sec-contact">
      <div class="v2-container contact-split">
        <div class="contact-left" id="contact-info">
          <!-- Rendered by JS -->
        </div>
        <div class="contact-right">
          <form class="contact-form">
            <input type="text" placeholder="Tên của bạn">
            <input type="email" placeholder="Email">
            <input type="text" placeholder="Website của bạn (nếu có)">
            <textarea placeholder="Tôi có thể giúp gì cho bạn?" rows="4"></textarea>
            <button type="submit" class="btn-black">Gửi liên hệ</button>
          </form>
        </div>
      </div>
    </section>

  </main>

  <footer class="portfolio-footer" id="dynamic-footer"><!-- Rendered by JS --></footer>

  <script src="./shared/components/header.js"></script>
  <script src="./shared/components/footer.js"></script>
  <script src="./shared/js/main.js"></script>
  <script src="./portfolio.js?v=1794179461"></script>
  <script src="./shared/components/ai-widget.js"></script>
</body>
</html>
